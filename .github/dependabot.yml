# Keeps the GitHub Actions used by the workflows up to date.
# Dependabot opens a pull request when a new version of an action is released;
# CI runs on it like on any other pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
    # One pull request for all action updates, instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"
