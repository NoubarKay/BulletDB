name: CI

# When it runs:
#   - pull requests to main: only the build jobs and test areas affected by the
#     changed files (docs-only changes skip the build entirely)
#   - pushes to main, version tags (v*), manual runs: everything, always
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Decide what to run, from the files changed in a pull request.
  # ---------------------------------------------------------------------------
  changes:
    name: Decide what to test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code:       ${{ steps.decide.outputs.code }}
      format:     ${{ steps.decide.outputs.format }}
      roundtrip:  ${{ steps.decide.outputs.roundtrip }}
      aggregates: ${{ steps.decide.outputs.aggregates }}
      corrupt:    ${{ steps.decide.outputs.corrupt }}
      filter:     ${{ steps.decide.outputs.filter }}
      csv_types:  ${{ steps.decide.outputs.csv_types }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:                       # anything that's compiled or builds it
              - 'src/**'
              - 'tests/**'
              - 'main.c'
              - 'CMakeLists.txt'
              - '.github/workflows/**'
            everything:                 # changes that every test depends on
              - 'CMakeLists.txt'
              - 'tests/CMakeLists.txt'
              - 'tests/test_util.h'
              - '.github/workflows/**'
              - 'src/common/**'
              - 'src/core/**'
              - 'src/csv/**'
              - 'src/storage/bdb_writer.*'
              - 'src/storage/bdb_format.h'
              - 'src/storage/io.*'
              - 'src/storage/memory.*'
            reader:
              - 'src/storage/bdb_reader.*'
            executor:
              - 'src/executor/**'
            test_format:     ['tests/test_format.c']
            test_roundtrip:  ['tests/test_roundtrip.c']
            test_aggregates: ['tests/test_aggregates.c']
            test_corrupt:    ['tests/test_corrupt.c']
            test_filter:     ['tests/test_filter.c']
            test_csv_types:  ['tests/test_csv_types.c']

      - name: Decide
        id: decide
        shell: bash
        run: |
          # Outside pull requests, run everything.
          if [ "${{ github.event_name }}" = "pull_request" ]; then all=false; else all=true; fi

          any() { for v in "$@"; do if [ "$v" = "true" ]; then echo true; return; fi; done; echo false; }

          code='${{ steps.filter.outputs.code }}'
          every='${{ steps.filter.outputs.everything }}'
          reader='${{ steps.filter.outputs.reader }}'
          executor='${{ steps.filter.outputs.executor }}'

          # Which source areas each test exercises:
          #   format     - CSV import + writer
          #   roundtrip  - CSV import + writer + reader + executor
          #   aggregates - CSV import + writer + reader + executor
          #   corrupt    - writer + reader
          #   filter     - CSV import + writer + reader + executor
          #   csv_types  - CSV import + writer + reader + executor
          {
            echo "code=$(any $all "$code")"
            echo "format=$(any $all "$every" '${{ steps.filter.outputs.test_format }}')"
            echo "roundtrip=$(any $all "$every" "$reader" "$executor" '${{ steps.filter.outputs.test_roundtrip }}')"
            echo "aggregates=$(any $all "$every" "$reader" "$executor" '${{ steps.filter.outputs.test_aggregates }}')"
            echo "corrupt=$(any $all "$every" "$reader" '${{ steps.filter.outputs.test_corrupt }}')"
            echo "filter=$(any $all "$every" "$reader" "$executor" '${{ steps.filter.outputs.test_filter }}')"
            echo "csv_types=$(any $all "$every" "$reader" "$executor" '${{ steps.filter.outputs.test_csv_types }}')"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Linux, GCC, Release
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (GCC, Release)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc

      - name: Build
        id: build
        run: cmake --build build --parallel

      - name: "Test: format (.bdb layout, byte for byte)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.format == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_format$"

      - name: "Test: round trip (CSV → .bdb → reader)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.roundtrip == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_roundtrip$"

      - name: "Test: aggregates (SUM/COUNT/MIN/MAX/AVG)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.aggregates == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_aggregates$"

      - name: "Test: corrupt files are rejected"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.corrupt == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_corrupt$"

      - name: "Test: filter (WHERE, selection vectors)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.filter == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_filter$"

      - name: "Test: CSV types (sniffer, strict parsing)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.csv_types == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_csv_types$"

  # ---------------------------------------------------------------------------
  # Linux, GCC, AddressSanitizer + UndefinedBehaviorSanitizer
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Linux (GCC, AddressSanitizer + UBSan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      # Any memory error, leak or undefined behavior fails the test.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc -DBDB_SANITIZE=ON

      - name: Build
        id: build
        run: cmake --build build --parallel

      - name: "Test: format (.bdb layout, byte for byte)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.format == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_format$"

      - name: "Test: round trip (CSV → .bdb → reader)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.roundtrip == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_roundtrip$"

      - name: "Test: aggregates (SUM/COUNT/MIN/MAX/AVG)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.aggregates == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_aggregates$"

      - name: "Test: corrupt files are rejected"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.corrupt == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_corrupt$"

      - name: "Test: filter (WHERE, selection vectors)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.filter == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_filter$"

      - name: "Test: CSV types (sniffer, strict parsing)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.csv_types == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_csv_types$"

  # ---------------------------------------------------------------------------
  # Windows, MSYS2 MinGW-w64, Release (the same kind of toolchain as CLion)
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (MinGW-w64, Release)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        id: build
        run: cmake --build build

      - name: "Test: format (.bdb layout, byte for byte)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.format == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_format$"

      - name: "Test: round trip (CSV → .bdb → reader)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.roundtrip == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_roundtrip$"

      - name: "Test: aggregates (SUM/COUNT/MIN/MAX/AVG)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.aggregates == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_aggregates$"

      - name: "Test: corrupt files are rejected"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.corrupt == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_corrupt$"

      - name: "Test: filter (WHERE, selection vectors)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.filter == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_filter$"

      - name: "Test: CSV types (sniffer, strict parsing)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.csv_types == 'true' }}
        run: ctest --test-dir build --output-on-failure -R "^test_csv_types$"
