name: CodeQL

# GitHub's static analysis for C: looks for memory errors, unchecked results,
# and security problems. Findings show up under Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'      # every Monday, to pick up new queries
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # For C, CodeQL analyzes whatever is compiled here (paths-ignore has no
      # effect on compiled languages), so the tests are left out of this
      # build. They create throwaway files and compare results exactly on
      # purpose; findings in them aren't actionable.
      - name: Build (engine and program only, no tests)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc -DBDB_BUILD_TESTS=OFF
          cmake --build build --parallel

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
